name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install FFmpeg with FFprobe
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $ff = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Filter ffmpeg.exe -Recurse -File | Select-Object -First 1
          if (-not $ff) { throw 'Could not locate full ffmpeg.exe binary' }
          $probe = Join-Path $ff.DirectoryName 'ffprobe.exe'
          if (-not (Test-Path $probe)) { throw 'Could not locate ffprobe.exe binary' }
          Copy-Item $ff.FullName bin\ffmpeg.exe
          Copy-Item $probe bin\ffprobe.exe
          & bin\ffmpeg.exe -version | Select-Object -First 1
          & bin\ffprobe.exe -version | Select-Object -First 1

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Build one-file GUI EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TiengHanSoEasyStudio --collect-all edge_tts --collect-all gtts --collect-all googleapiclient --collect-all google_auth_oauthlib --add-data "studio\ui.html;studio" --add-binary "bin\ffmpeg.exe;." --add-binary "bin\ffprobe.exe;." launcher.py
          if (-not (Test-Path dist\TiengHanSoEasyStudio.exe)) { throw 'EXE missing' }
          Get-Item dist\TiengHanSoEasyStudio.exe | Select-Object Name,Length
          Get-FileHash dist\TiengHanSoEasyStudio.exe -Algorithm SHA256

      - name: Smoke test packaged EXE HTTP server
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD\dist\TiengHanSoEasyStudio.exe" -ArgumentList '--smoke-server' -PassThru
          $ready = $false
          try {
            for ($i = 0; $i -lt 55; $i++) {
              Start-Sleep -Seconds 2
              if ($process.HasExited) { throw 'Packaged Studio process terminated before ready' }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 3 -NoProxy
                if ($health.status -eq 'ok' -and $health.app -eq 'TiengHanSoEasyStudio') {
                  $ready = $true
                  break
                }
              } catch {
                # Extraction and binding may take time in PyInstaller one-file mode.
              }
            }
            if (-not $ready) { throw 'EXE did not respond on localhost:8765/health' }
            $homePage = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -TimeoutSec 5 -NoProxy
            if ($homePage.StatusCode -ne 200 -or $homePage.Content -notmatch 'TIẾNG HÀN SO EASY' -or $homePage.Content -notmatch 'Đổi chủ đề') {
              throw 'EXE homepage HTTP smoke test failed'
            }
            $status = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/status" -TimeoutSec 5 -NoProxy
            if ($null -eq $status.questions) { throw 'EXE /api/status smoke test failed' }
            $random = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/topic/random" -TimeoutSec 5 -NoProxy
            if (-not $random.topic) { throw "EXE random topic endpoint failed" }
            if (-not $status.models.gemini) { throw "EXE model settings missing from status" }
            if ($homePage.Content -notmatch 'Chọn model AI') { throw 'Model selector UI missing from built EXE' }
            if ($null -eq $status.tts_engines.edge -or $null -eq $status.tts_engines.google) { throw 'Bundled TTS engines missing' }
            if ($homePage.Content -notmatch 'Thử giọng tiếng Hàn') { throw 'Voice test UI missing' }
            if ($null -eq $status.production.think) { throw 'Production settings are missing' }
            if ($null -eq $status.facebook.connected) { throw 'Facebook connection status is missing' }
            if ($null -eq $status.batches) { throw 'Batch history is missing' }
            if ($homePage.Content -notmatch 'previewMotion' -or $homePage.Content -notmatch 'renderBatch') {
              throw 'Preview or batch video UI missing'
            }
            if ($homePage.Content -notmatch 'Kết nối Facebook Page') { throw 'Meta Page connection UI missing' }
            if ($homePage.Content -notmatch 'Đếm ngược sau khi đọc xong') { throw 'Audio-first countdown UI missing' }
            if ($homePage.Content -notmatch 'phiên âm Latin' -and $homePage.Content -notmatch 'phiên âm') { throw 'Pronunciation UI missing' }
            if ($null -eq $status.production.logo_x -or $null -eq $status.production.metadata_artist) { throw 'v1.2.0 production settings missing' }
            if ($homePage.Content -notmatch 'renderProgressBar' -or $homePage.Content -notmatch 'logoSprite') {
              throw 'Drag logo or export progress UI missing'
            }
            if ($homePage.Content -notmatch 'Ghi đè metadata' -or $homePage.Content -notmatch 'Sửa nghĩa') {
              throw 'Copyright metadata or four-answer editing UI missing'
            }
            if ($null -eq $status.youtube -or $null -eq $status.instagram -or $null -eq $status.production_runs) {
              throw "Multi-platform or durable production metadata missing"
            }
            if ($homePage.Content -notmatch 'autoStart' -or $homePage.Content -notmatch 'cacheClear' -or $homePage.Content -notmatch 'crossPlatform') {
              throw "Autopilot, cache and cross-platform UI missing"
            }
            if ($status.production.shorts_safe -ne $true) { throw "Shorts safe rendering not enabled" }
            if ($null -eq $status.upcoming_events) { throw 'Event calendar missing' }
            if ($null -eq $status.production.auto_metadata) { throw 'Automatic metadata flag missing' }
            if ($homePage.Content -notmatch 'autoEventMode' -or $homePage.Content -notmatch 'metadataAdvanced') {
              throw 'Seasonal or automatic metadata interface missing'
            }
            if ($homePage.Content -match 'fps:24,') { throw 'Old 24fps override still present' }
            if ($homePage.Content -notmatch 'repairMetadataBulk' -or $homePage.Content -notmatch 'inspectMetadata') {
              throw 'MP4 metadata readback/legacy repair interface missing'
            }
            if ($homePage.Content -notmatch 'bulkVerifyAI' -or $homePage.Content -notmatch 'crossThumbnail') {
              throw "KRDict / thumbnail controls missing"
            }
            if ($null -eq $status.youtube_thumbnails) {
              throw "Thumbnail upload queue missing"
            }
            if (-not ($status.providers.krdict)) {
              throw "KRDict key integration missing"
            }
            Write-Output "Studio v1.2.0 dictionary QA, auto thumbnails and durable YouTube cover smoke passed"
          } catch {
            $logPath = Join-Path $env:LOCALAPPDATA "TiengHanSoEasyStudio\studio.log"
            if (Test-Path $logPath) { Get-Content $logPath -Tail 100 }
            throw
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Upload downloadable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiengHanSoEasyStudio-Windows-EXE
          path: dist/TiengHanSoEasyStudio.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publish Windows release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Tiếng Hàn So Easy Studio v1.2.0
          target_commitish: main
          files: dist/TiengHanSoEasyStudio.exe
          make_latest: true
          generate_release_notes: false
          body: |
            Windows standalone EXE built by GitHub Actions. Double-click to open.
            AI and TTS require Internet; Facebook publishing requires Page permissions.
            Personal keys remain in the local data folder, never commit them.
